<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkGPT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <span class="logo">&#9889;</span>
        <h1>DarkGPT</h1>
      </div>
      <div class="header-right">
        <button id="btn-sidepanel" title="Open in side panel">&#x25a7;</button>
        <button id="btn-settings" title="Settings">&#9881;</button>
      </div>
    </header>

    <div id="setup-screen" class="screen">
      <div class="setup-card">
        <h2>Welcome to DarkGPT</h2>
        <p>Configure your API provider to get started.</p>
        <div class="form-group">
          <label for="setup-provider">Provider</label>
          <select id="setup-provider">
            <option value="groq">Groq (Free tier available)</option>
            <option value="openrouter">OpenRouter (Multi-model)</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="custom">Custom endpoint</option>
          </select>
        </div>
        <div class="form-group">
          <label for="setup-key">API Key</label>
          <input type="password" id="setup-key" placeholder="Enter your API key">
        </div>
        <div class="form-group" id="custom-endpoint-group" style="display:none">
          <label for="setup-endpoint">Custom Endpoint URL</label>
          <input type="url" id="setup-endpoint" placeholder="https://your-api.example.com/v1">
        </div>
        <button id="btn-save-setup" class="btn-primary">Save & Start</button>
      </div>
    </div>

    <div id="chat-screen" class="screen" style="display:none">
      <div id="model-bar">
        <select id="model-select"></select>
        <button id="btn-new-chat" title="New chat">+</button>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <div id="context-bar" style="display:none">
          <span id="context-label"></span>
          <button id="btn-clear-context" title="Clear context">&times;</button>
        </div>
        <div class="input-row">
          <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
          <button id="btn-send" title="Send">&#10148;</button>
        </div>
        <div class="input-actions">
          <button id="btn-extract" title="Extract page content">&#128196; Page</button>
          <button id="btn-select" title="Select text on page">&#128270; Select</button>
          <button id="btn-screenshot" title="Describe visible page">&#128247; Screen</button>
        </div>
      </div>
    </div>
  </div>
  <script src="lib/marked.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
